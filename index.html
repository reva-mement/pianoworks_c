<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GAME ON — 6レーン レイアウトサンプル</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  .stage{
    position:relative;
    width:100vw;height:100vh;height:100svh;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 25%, rgba(45,70,140,0.07), transparent 65%),
      linear-gradient(180deg, #14110d 0%, #1c1712 100%);
    user-select:none;
    -webkit-user-select:none;
  }

  .playfield{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    perspective:500px;
  }

  /* 6レーン（鍵盤の数だけ） */
  .lane{
    flex:1;
    position:relative;
    border-right:1px solid rgba(255,255,255,0.05);
    display:flex;
    flex-direction:column;
  }

  .fall-area{
    flex:1;
    position:relative;
  }

  .note{
    position:absolute;
    border-radius:10px;
    background:transparent;
    border:2px solid rgba(150,150,155,0.9);
    box-sizing:border-box;
    filter:url(#note-wobble);
    animation:noteBreathe 3.4s ease-in-out infinite;
    cursor:pointer;
  }
  .note .mini-bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(40,120,235,0.85);
    border:1px solid rgba(30,110,230,0.6);
    transition:transform 1.4s ease-in-out;
  }
  .note .mini-bubble-line{
    position:absolute;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(150,150,155,0.8);
    transition:transform 1.4s ease-in-out;
  }
  @keyframes noteBreathe{
    0%, 100%{opacity:0.7;}
    50%{opacity:1;}
  }
  .note{cursor:pointer;}
  @keyframes notePop{
    0%{transform:scale(1); opacity:1;}
    35%{transform:scale(1.18); opacity:0.9;}
    100%{transform:scale(0.2); opacity:0;}
  }
  .note.popping{
    animation:notePop 0.32s cubic-bezier(0.34, 1.2, 0.64, 1) forwards !important;
  }
  .droplet{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(200,215,235,0.95), rgba(40,65,150,0.55) 70%);
    box-shadow:0 0 4px rgba(70,100,190,0.5);
    pointer-events:none;
  }
  @keyframes dropletBurst{
    0%{transform:translate(0,0) scale(1); opacity:0.95;}
    100%{transform:translate(var(--dx), var(--dy)) scale(0.3); opacity:0;}
  }
  .splash-ring{
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(180,200,230,0.6);
    background:transparent;
    pointer-events:none;
  }
  @keyframes splashRing{
    0%{transform:translate(-50%,-50%) scale(0.2); opacity:0.8; border-width:3px;}
    100%{transform:translate(-50%,-50%) scale(2.4); opacity:0; border-width:0.5px;}
  }
  .rising-bubble{
    position:absolute;
    bottom:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(210,225,245,0.85), rgba(50,80,170,0.35) 70%);
    border:1px solid rgba(180,200,230,0.4);
    pointer-events:none;
  }
  @keyframes bubbleRise{
    0%{transform:translate(0, 0); opacity:0;}
    12%{opacity:0.85;}
    100%{transform:translate(var(--drift, 0px), -100%); opacity:0;}
  }

  /* 鍵盤（象牙・木目調、白鍵黒鍵の塗り分けなし） */
  .key{
    height:208px;
    margin:0 0 10px 0;
    border-radius:0;
    touch-action:none;
    transform-origin:top center;
    filter:blur(0.7px);
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 6px),
      linear-gradient(180deg, #ece2cd 0%, #d8c9a8 55%, #c2af86 100%);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.6),
      inset 0 -6px 10px rgba(90,68,35,0.35),
      0 3px 0 rgba(0,0,0,0.4);
    position:relative;
    transform:rotateX(0deg) translateY(0);
    transition:transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease-out;
  }
  .key.pressed{
    transform:rotateX(var(--press-tilt, -9deg)) translateY(var(--press-dip, 3px));
    transition:transform 0.045s ease-out, box-shadow 0.045s ease-out;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(90,68,35,0.45),
      0 1px 0 rgba(0,0,0,0.4);
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 6px),
      linear-gradient(180deg, #dcc9a0 0%, #c8b284 55%, #b39d76 100%);
  }
  .key::after{
    content:'';
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .key.pressed::after{
    animation:keyflash 0.18s ease-out;
  }
  @keyframes keyflash{
    0%{opacity:.35;}
    100%{opacity:0;}
  }

  /* 装飾用の黒鍵（あたり判定なし）。白鍵の押し込みと無関係な、独立した最前面レイヤーに置く */
  .black-keys-layer{
    position:absolute;
    left:0; right:14.2857%; bottom:89px; /* 白鍵の上端(奥側)に揃える: 10(margin)+208(白鍵)-129(黒鍵) */
    height:129px; /* 白鍵208pxの約62% */
    pointer-events:none;
    z-index:10;
  }
  .black-key{
    position:absolute;
    top:0;
    width:9.3%; /* レーン1本(=1/6=16.7%)の約56% */
    height:100%;
    filter:blur(0.7px);
    background:linear-gradient(180deg, #2a2320 0%, #100d0b 100%);
    border-radius:0 0 3px 3px;
    box-shadow:0 4px 6px rgba(0,0,0,0.5), inset 0 -8px 10px rgba(255,255,255,0.04);
    transform:translateX(-50%);
  }

  /* 右端：鍵盤1つぶんのスコア欄 */
  .score-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:18px;
    border-left:1px solid rgba(232,150,66,0.25);
    background:rgba(20,17,13,0.35);
  }
  .score-label{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:2px;
    color:#c9bfa9;
    opacity:.8;
  }
  .score-value{
    font-family:'Yomogi', cursive;
    font-size:20px;
    color:#f3ede0;
    margin-top:4px;
    text-shadow:0 0 8px rgba(232,150,66,0.35);
  }
  .combo-label{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:10px;
    letter-spacing:1px;
    color:#a99f8c;
    margin-top:22px;
  }
  .combo-value{
    font-family:'Yomogi', cursive;
    font-size:16px;
    color:#e8a24a;
    margin-top:2px;
  }
  .score-key-spacer{
    height:208px;
    margin-bottom:10px;
  }

  .hint{
    position:absolute;
    top:10px; left:0; right:0;
    text-align:center;
    font-family:'Yomogi', cursive;
    font-size:12px;
    color:#a99f8c;
    opacity:.7;
    pointer-events:none;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<filter id="note-wobble" x="-30%" y="-30%" width="160%" height="160%">
<feTurbulence type="fractalNoise" baseFrequency="0.06 0.09" numOctaves="2" seed="11" result="noise"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
</filter>
</svg>
<div class="stage">
  <div class="hint">6レーン + 右端スコア欄（鍵盤1つぶんの幅）</div>
  <div class="playfield" id="playfield">
    <!-- 6レーンはJSで生成 -->
  </div>
</div>

<script>
  var playfield = document.getElementById('playfield');
  var LANES = 6;
  var laneStates = [];
  for (var li = 0; li < LANES; li++) { laneStates.push({ notes: [], bubbles: [] }); }

  for (var i = 0; i < LANES; i++) {
    var lane = document.createElement('div');
    lane.className = 'lane';

    var fallArea = document.createElement('div');
    fallArea.className = 'fall-area';
    fallArea.id = 'fall-' + i;

    var key = document.createElement('div');
    key.className = 'key';
    key.dataset.lane = i;

    lane.appendChild(fallArea);
    lane.appendChild(key);
    playfield.appendChild(lane);
  }

  // 装飾用の黒鍵（あたり判定なし）。白鍵の押し込みと無関係な独立レイヤーに配置。
  // C-C#-D-D#-E-F のような6半音の並びを想定し、レーン境界(0-1, 1-2, 3-4, 4-5)に置く。
  var blackKeysLayer = document.createElement('div');
  blackKeysLayer.className = 'black-keys-layer';
  [0, 1, 3, 4].forEach(function(boundaryIndex){
    var bk = document.createElement('div');
    bk.className = 'black-key';
    bk.style.left = ((boundaryIndex + 1) / LANES * 100) + '%';
    blackKeysLayer.appendChild(bk);
  });
  document.querySelector('.stage').appendChild(blackKeysLayer);

  // ---- ベロシティ推定（接触面積があれば使う。なければ中間値にフォールバック） ----
  var DEFAULT_VELOCITY = 90; // 0-127、接触面積が取れない端末向けの中間値

  function estimateVelocity(e){
    // Touch APIのradiusXが取れる端末では、接触面積から強さを推定する
    var touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
    if (touch && typeof touch.radiusX === 'number' && touch.radiusX > 0) {
      // 経験的に、指の接触半径はだいたい8px(弱)〜20px(強)くらいの幅に収まることが多い
      var norm = Math.min(1, Math.max(0, (touch.radiusX - 8) / (20 - 8)));
      return Math.round(30 + norm * 97); // 30(弱)〜127(強)
    }
    return DEFAULT_VELOCITY;
  }

  function applyVelocityVisual(keyEl, velocity){
    // ベロシティが強いほど、沈み込みを少し深く・フラッシュを少し強くする（体感のフィードバック用）
    var norm = velocity / 127;
    var tilt = -6 - norm * 6; // -6deg(弱) 〜 -12deg(強)
    var dip = 2 + norm * 2;   // 2px(弱) 〜 4px(強)
    keyEl.style.setProperty('--press-tilt', tilt + 'deg');
    keyEl.style.setProperty('--press-dip', dip + 'px');
  }

  var allKeys = Array.prototype.slice.call(document.querySelectorAll('.key'));
  var activeKey = null;
  var isSliding = false;

  function keyAtPoint(x, y){
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    return el.closest ? el.closest('.key') : null;
  }

  function pressKey(key, velocity){
    if (activeKey === key) return;
    if (activeKey) activeKey.classList.remove('pressed');
    activeKey = key;
    if (activeKey) {
      applyVelocityVisual(activeKey, velocity != null ? velocity : DEFAULT_VELOCITY);
      activeKey.classList.add('pressed');
    }
  }

  function releaseAll(){
    if (activeKey) activeKey.classList.remove('pressed');
    activeKey = null;
    isSliding = false;
  }

  allKeys.forEach(function(key){
    key.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      isSliding = true;
      var velocity = estimateVelocity(e);
      pressKey(key, velocity);
      if (key.setPointerCapture) {
        try { key.setPointerCapture(e.pointerId); } catch(err){}
      }
    });
  });

  document.addEventListener('pointermove', function(e){
    if (!isSliding) return;
    var k = keyAtPoint(e.clientX, e.clientY);
    if (k) pressKey(k);
  });

  document.addEventListener('pointerup', releaseAll);
  document.addEventListener('pointercancel', releaseAll);

  // ---- 鍵盤から立ち上り続ける泡（衝突判定できるようJSで位置管理する） ----
  function spawnRisingBubble(fallArea, laneIndex){
    var b = document.createElement('div');
    b.className = 'rising-bubble';
    var size = 4 + Math.random() * 6;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = (10 + Math.random() * 80) + '%';
    fallArea.appendChild(b);
    laneStates[laneIndex].bubbles.push({
      el: b,
      risen: 0,
      speed: 90 + Math.random() * 50, // px/秒
      size: size
    });
  }

  allKeys.forEach(function(key){
    var laneIndex = parseInt(key.dataset.lane, 10);
    var fallArea = document.getElementById('fall-' + laneIndex);

    // 鍵盤を押している間だけ、泡が立ち上る
    var pressedLoopId = null;
    function startPressedStream(){
      if (pressedLoopId) return;
      (function loopPressed(){
        if (!key.classList.contains('pressed')) { pressedLoopId = null; return; }
        spawnRisingBubble(fallArea, laneIndex);
        pressedLoopId = setTimeout(loopPressed, 90 + Math.random() * 80);
      })();
    }
    var mo = new MutationObserver(function(){
      if (key.classList.contains('pressed')) startPressedStream();
    });
    mo.observe(key, { attributes:true, attributeFilter:['class'] });
  });

  // 右端：鍵盤1つぶんのスコア欄
  var scorePanel = document.createElement('div');
  scorePanel.className = 'score-panel';
  scorePanel.innerHTML =
    '<div class="score-label">SCORE</div>' +
    '<div class="score-value" id="scoreValue">128,400</div>' +
    '<div class="combo-label">COMBO</div>' +
    '<div class="combo-value" id="comboValue">24</div>' +
    '<div style="flex:1;"></div>' +
    '<div class="score-key-spacer"></div>';
  playfield.appendChild(scorePanel);

  // ---- 見た目確認用：到達時刻ベースでノーツを先読み生成する ----
  // 「今すぐ全部作る」のではなく、実際に落ち始める少し前だけDOMに存在させる。
  // こうすることで、SVGフィルター(手書き感のある輪郭)のコストは
  // 「同時に画面に映っている数」だけで済み、曲全体の音符数には左右されなくなる。
  var FALL_DURATION_MS = 2600; // ノーツが上端から鍵盤に届くまでの時間
  var MISS_GRACE_MS = 600;     // 鍵盤に到達してから、取りこぼしとして静かに消えるまでの猶予

  // デモ用のスケジュール（本来はMIDIのnote.timeがそのままここに入る想定）
  var noteSchedule = [];
  (function buildDemoSchedule(){
    var t = 1500;
    var pattern = [0,1,2,3,4,5,2,4,1,5];
    for (var cycle = 0; cycle < 8; cycle++) {
      pattern.forEach(function(lane, idx){
        var isLong = (cycle % 3 === 1 && (idx === 2 || idx === 7));
        noteSchedule.push({ lane: lane, arrivalTime: t, long: isLong });
        t += 380 + Math.random() * 260;
      });
    }
  })();

  var scheduleIndex = 0;
  var clockStart = performance.now();
  function nowMs(){ return performance.now() - clockStart; }

  function spawnNote(entry){
    var area = document.getElementById('fall-' + entry.lane);
    var note = document.createElement('div');
    note.className = 'note';

    var pitchNorm = entry.lane / (LANES - 1);
    var height = (28 + Math.random() * 34) * (1.15 - pitchNorm * 0.35);
    if (entry.long) { height *= 4.5; }
    var inset = 6 + Math.random() * 6;
    note.style.left = inset + 'px';
    note.style.right = inset + 'px';
    note.style.height = height + 'px';
    note.style.top = (-height) + 'px'; // 上端の外側から登場する

    var breatheDur = (3 + Math.random() * 1.4) * (1.25 - pitchNorm * 0.45);
    var breatheDelay = -Math.random() * breatheDur;
    note.style.animation = 'noteBreathe ' + breatheDur.toFixed(2) + 's ease-in-out ' + breatheDelay.toFixed(2) + 's infinite';

    var miniCount = 4;
    for (var m = 0; m < miniCount; m++) {
      var mini = document.createElement('div');
      mini.className = (m === 0) ? 'mini-bubble' : 'mini-bubble-line';
      var miniSize = Math.min(height, 26) * (0.35 + Math.random() * 0.35);
      mini.style.width = miniSize + 'px';
      mini.style.height = miniSize + 'px';
      mini.style.left = (6 + Math.random() * 55) + '%';
      mini.style.top = (Math.max(4, height * 0.15)) + (Math.random() * Math.max(4, height * 0.5)) + 'px';
      note.appendChild(mini);
      driftMiniBubble(mini, height);
    }

    area.appendChild(note);

    var areaHeightForSpeed = area.clientHeight || 260;
    var record = {
      el: note,
      y: -height,
      height: height,
      speed: areaHeightForSpeed / (FALL_DURATION_MS / 1000), // 予定時刻ちょうどに鍵盤へ届く速さ
      arrivalTime: entry.arrivalTime,
      popped: false,
      missDeadline: null
    };
    laneStates[entry.lane].notes.push(record);

    note.addEventListener('pointerdown', function(ev){
      ev.stopPropagation();
      if (!record.popped) {
        record.popped = true;
        popNote(note, area);
      }
    });
  }

  // 先読みスケジューラ：到達時刻の少し前(FALL_DURATION_MS分)になったノーツだけを生成する
  function scheduleTick(){
    var elapsed = nowMs();
    while (scheduleIndex < noteSchedule.length && (noteSchedule[scheduleIndex].arrivalTime - FALL_DURATION_MS) <= elapsed) {
      spawnNote(noteSchedule[scheduleIndex]);
      scheduleIndex++;
    }
  }
  setInterval(scheduleTick, 20);
  scheduleTick();


  function popNote(note, area){
    if (note.classList.contains('popping')) return;
    var rect = note.getBoundingClientRect();
    var areaRect = area.getBoundingClientRect();
    var cx = rect.left - areaRect.left + rect.width / 2;
    var cy = rect.top - areaRect.top + rect.height / 2;

    note.classList.add('popping');

    // 弾ける瞬間の輪（水面の波紋のような一瞬の広がり）
    var ring = document.createElement('div');
    ring.className = 'splash-ring';
    var ringSize = Math.max(rect.width, rect.height) * 1.1;
    ring.style.width = ringSize + 'px';
    ring.style.height = ringSize + 'px';
    ring.style.left = cx + 'px';
    ring.style.top = cy + 'px';
    ring.style.animation = 'splashRing 0.5s ease-out forwards';
    area.appendChild(ring);
    ring.addEventListener('animationend', function(){ ring.remove(); });

    // 水しぶきの粒（droplet）を数個、上向き寄りにランダムに飛び散らせる
    var dropletCount = 6 + Math.floor(Math.random() * 4);
    for (var i = 0; i < dropletCount; i++) {
      var d = document.createElement('div');
      d.className = 'droplet';
      var dsize = 3 + Math.random() * 5;
      d.style.width = dsize + 'px';
      d.style.height = dsize + 'px';
      d.style.left = (cx - dsize / 2) + 'px';
      d.style.top = (cy - dsize / 2) + 'px';

      var angle = (Math.random() * Math.PI) + Math.PI; // 上半分寄りの方向（水しぶきが上に上がる感じ）
      var dist = 18 + Math.random() * 30;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist * 0.8;
      d.style.setProperty('--dx', dx.toFixed(1) + 'px');
      d.style.setProperty('--dy', dy.toFixed(1) + 'px');
      var dur = 0.4 + Math.random() * 0.25;
      d.style.animation = 'dropletBurst ' + dur.toFixed(2) + 's ease-out forwards';

      area.appendChild(d);
      (function(el){ el.addEventListener('animationend', function(){ el.remove(); }); })(d);
    }

    note.addEventListener('animationend', function(){ note.remove(); }, { once:true });
  }

  // 気泡内部の小さな泡を、ランダムな間隔でランダムな位置へふわっと動かし続ける
  function driftMiniBubble(mini, noteHeight){
    function moveOnce(){
      var dx = (Math.random() - 0.5) * 14; // 左右にじわっと
      var dy = (Math.random() - 0.5) * Math.min(14, noteHeight * 0.3);
      mini.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px)';
      var nextDelay = 900 + Math.random() * 1800; // 0.9秒〜2.7秒のランダムな間隔
      setTimeout(moveOnce, nextDelay);
    }
    setTimeout(moveOnce, Math.random() * 1000); // 開始タイミングもバラす
  }

  // ---- メインループ：ノーツの落下、泡の上昇、衝突判定 ----
  var lastFrameTime = null;
  function gameLoop(ts){
    if (lastFrameTime == null) lastFrameTime = ts;
    var dt = (ts - lastFrameTime) / 1000;
    lastFrameTime = ts;

    laneStates.forEach(function(state, laneIndex){
      var fallArea = document.getElementById('fall-' + laneIndex);
      var areaHeight = fallArea.clientHeight || 260;

      // ノーツを落下させる
      state.notes.forEach(function(record){
        if (record.popped) return;
        record.y += record.speed * dt;
        if (record.y + record.height > areaHeight) {
          record.y = areaHeight - record.height; // 鍵盤の位置で止まる(取りこぼし状態)
          if (record.missDeadline === null) {
            record.missDeadline = nowMs() + MISS_GRACE_MS; // 猶予時間の後、静かに片付ける
          }
        }
        record.el.style.top = record.y + 'px';
      });

      // 取りこぼしたまま猶予時間を過ぎたノーツを、静かに片付ける（弾ける演出はしない）
      state.notes.forEach(function(record){
        if (record.popped) return;
        if (record.missDeadline !== null && nowMs() >= record.missDeadline) {
          record.popped = true;
          record.el.style.transition = 'opacity 0.3s ease-out';
          record.el.style.opacity = '0';
          (function(el){ setTimeout(function(){ if (el.parentNode) el.remove(); }, 320); })(record.el);
        }
      });

      // 泡を上昇させる
      state.bubbles.forEach(function(b){
        b.risen += b.speed * dt;
        b.el.style.bottom = b.risen + 'px';
      });

      // 衝突判定：泡がノーツの高さに達したら、そのノーツを弾けさせる
      state.bubbles.forEach(function(b){
        if (b.consumed) return;
        var bubbleTopY = areaHeight - b.risen - b.size; // 泡の上端のy位置（fall-area上端基準）
        state.notes.forEach(function(record){
          if (record.popped) return;
          if (bubbleTopY <= record.y + record.height && bubbleTopY + b.size >= record.y) {
            record.popped = true;
            b.consumed = true;
            popNote(record.el, fallArea);
          }
        });
      });

      // 画面外に出た泡・処理済みの泡を片付ける
      state.bubbles = state.bubbles.filter(function(b){
        if (b.consumed || b.risen > areaHeight + 20) {
          if (b.el.parentNode) b.el.remove();
          return false;
        }
        return true;
      });

      // 弾け終わったノーツは配列から片付ける（要素自体はpopNote側で削除される）
      state.notes = state.notes.filter(function(record){ return !record.popped; });
    });

    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
