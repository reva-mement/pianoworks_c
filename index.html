<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PianoWorks Crescendo — 画面遷移プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Zen+Old+Mincho&family=Yomogi&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  .stage{
    position:relative;
    width:100vw;height:100vh;height:100svh;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    background:#000;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .scene{
    position:absolute; inset:0;
    opacity:1;
    transition:opacity 0.9s ease;
    will-change:opacity;
    transform:translateZ(0);
    backface-visibility:hidden;
  }
  .scene.hidden{
    opacity:0;
    pointer-events:none;
  }
  .art{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
  }
  .scrim{
    position:absolute;top:0;left:0;right:0;height:30%;
    background:linear-gradient(to bottom, rgba(20,17,12,0.28), rgba(20,17,12,0));
    pointer-events:none;
  }

  /* ---- opening scene text ---- */
  @media (prefers-reduced-motion: no-preference){
    #scene-title .eyebrow{animation:fadein 0.3s ease-out forwards;}
    #scene-title .title{animation:reveal 5s cubic-bezier(0.16,1,0.3,1) 0.6s both;}
    .tap{animation:pulse 2.4s ease-in-out infinite;}
  }
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  @keyframes fadein{from{opacity:0;}to{opacity:.9;}}
  @keyframes reveal{
    0%{clip-path:inset(0 100% 0 0); filter:blur(12px); letter-spacing:10px; text-shadow:0 0 0 rgba(251,245,230,0);}
    70%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 0 rgba(251,245,230,0);}
    100%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 18px rgba(251,245,230,0.45);}
  }
  .titlewrap{position:absolute;top:9%;left:0;right:0;text-align:center;pointer-events:none;}
  .eyebrow{font-family:'Yomogi', cursive;font-size:13px;letter-spacing:6px;color:#efe8d8;opacity:0;}
  .title{font-family:'Cormorant Garamond', serif;font-style:italic;font-size:44px;color:#fbf5e6;margin-top:6px;letter-spacing:1px;opacity:1;clip-path:inset(0 100% 0 0);}
  .tap{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-family:'Zen Old Mincho', serif;font-size:13px;letter-spacing:4px;color:#efe8d8;}

  /* ---- home scene ---- */
  .home-wordmark{position:absolute;top:8%;left:0;right:0;text-align:center;font-family:'Cormorant Garamond', serif;font-style:italic;font-size:20px;color:#efe4cf;opacity:.85;}
  .home-menu{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:row;justify-content:center;gap:0;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;}

  @keyframes bgripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.8; border-width:5px;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0; border-width:0.5px;}
  }
  .bgripple{
    position:absolute; border-radius:50%;
    border:5px solid rgba(221,208,197,0.6);
    box-shadow:0 0 10px rgba(221,208,197,0.3);
    background:transparent;
    filter:blur(3.5px);
    pointer-events:none;
    animation:bgripple 1.8s ease-out forwards;
  }
  @keyframes dragripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.5; border-width:2.5px;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0; border-width:0.5px;}
  }
  .dragripple{
    position:absolute; border-radius:50%;
    border:2.5px solid rgba(221,208,197,0.5);
    box-shadow:0 0 6px rgba(221,208,197,0.25);
    background:transparent;
    filter:blur(2px);
    pointer-events:none;
    animation:dragripple 0.9s ease-out forwards;
  }
  @keyframes ripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.55;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0;}
  }
  .ripplefx{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(230,224,208,0.5) 0%, rgba(200,194,178,0.25) 45%, rgba(200,194,178,0) 72%);
    filter:url(#ripple);
    pointer-events:none;
    animation:ripple 1.2s ease-out forwards;
  }
  .aqbtn{
    position:relative; flex:1; min-width:0; height:64px; cursor:pointer; overflow:hidden; border-radius:0;
    border:2px solid #a9a49690;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.25), inset 0 -8px 16px rgba(0,0,0,0.2), 0 3px 0 rgba(0,0,0,0.35);
    background:rgba(20,18,15,0.32);
    backdrop-filter:blur(7px) saturate(1.1);
    -webkit-backdrop-filter:blur(7px) saturate(1.1);
    transition:transform 0.09s ease-out, box-shadow 0.09s ease-out, backdrop-filter 0.12s ease-out, -webkit-backdrop-filter 0.12s ease-out;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;
  }
  .aqbtn.pressed{
    transform:translateY(2px) scale(0.985);
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.55), inset 0 -4px 10px rgba(0,0,0,0.3), 0 1px 0 rgba(0,0,0,0.5);
    backdrop-filter:blur(2px) saturate(1.25);
    -webkit-backdrop-filter:blur(2px) saturate(1.25);
  }
  .aqbtn .caustic-layer{position:absolute; inset:0; opacity:.3; mix-blend-mode:screen; filter:url(#caustic);}
  .aqbtn + .aqbtn{border-left:none;}
  .aqbtn:first-child{border-top-left-radius:22px;border-bottom-left-radius:22px;}
  .aqbtn:last-child{border-top-right-radius:22px;border-bottom-right-radius:22px;}
  .aqbtn .label{font-family:'Yomogi', cursive; font-size:13px; letter-spacing:2px; color:#f3ede0; text-shadow:0 0 10px rgba(230,224,208,0.4); white-space:nowrap;}

  #btn-piano-mark, #btn-settings{
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.25), inset 0 -6px 12px rgba(0,0,0,0.2), 0 2px 0 rgba(0,0,0,0.3);
    overflow:hidden;
  }
  #btn-piano-mark.pressed, #btn-settings.pressed{
    transform:translateY(2px) scale(0.92) !important;
    backdrop-filter:blur(0.5px) !important;
    -webkit-backdrop-filter:blur(0.5px) !important;
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.5), inset 0 -3px 8px rgba(0,0,0,0.3), 0 1px 0 rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="scene" id="scene-title">
    <video class="art" autoplay muted loop playsinline>
      <source src="assets/opening-bg.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
    <div class="titlewrap">
      <div class="eyebrow">P I A N O W O R K S</div>
      <div class="title">Crescendo</div>
    </div>
    <div class="tap">タップして始める</div>
  </div>

  <div class="scene hidden" id="scene-home">
    <video class="art" autoplay muted loop playsinline preload="auto" id="homeVideo">
      <source src="assets/home-bg.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
    <div id="btn-piano-mark" style="position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(211,211,211,0.1); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); border:2px solid rgba(232,150,66,0.35); z-index:15; cursor:pointer; transition:transform 0.15s ease-out;">
      <img src="assets/piano-icon.png" alt="" style="width:60%; height:60%; object-fit:contain; pointer-events:none;">
    </div>
    <div id="btn-settings" style="position:absolute; top:calc(65px + env(safe-area-inset-top)); right:12px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(211,211,211,0.1); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); border:2px solid rgba(232,150,66,0.35); z-index:15; cursor:pointer; transition:transform 0.15s ease-out;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbd210" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
    <input type="file" id="midi-upload" accept=".mid,.midi" style="display:none;">
    <div id="import-status" style="position:absolute; left:0; right:0; top:40%; text-align:center; font-family:'Yomogi', cursive; font-size:13px; letter-spacing:2px; color:#efe4cf; opacity:0; transition:opacity 0.4s ease; pointer-events:none;"></div>
    <div class="home-menu">
      <div class="aqbtn" id="btn-import">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">IMPORT</div>
        </div>
      </div>
      <div class="aqbtn" id="btn-jukebox">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">JUKEBOX</div>
        </div>
      </div>
      <div class="aqbtn" id="btn-studio">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">STUDIO</div>
        </div>
      </div>
    </div>

    <div id="jukebox-overlay" style="position:absolute; inset:0; background:rgba(10,9,7,0.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; flex-direction:column; z-index:20;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px;">
        <div style="font-family:'Yomogi', cursive; font-size:20px; color:#efe4cf;">Jukebox</div>
        <div id="jukebox-close" style="color:#efe4cf; font-size:22px; padding:4px 10px; cursor:pointer;">×</div>
      </div>
      <div id="jukebox-list" style="flex:1; overflow-y:auto; padding:0 16px 16px 16px; display:flex; flex-direction:column; gap:0;"></div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <filter id="ripple" x="-80%" y="-80%" width="260%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.03" numOctaves="3" seed="9" result="noise"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="caustic" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" seed="3" result="noise">
        <animate attributeName="baseFrequency" values="0.02 0.06;0.03 0.05;0.02 0.06" dur="6s" repeatCount="indefinite"></animate>
      </feTurbulence>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.85, 0 0 0 0 0.8, 0 0 0 0 0.7, 0 0 0 0.5 0"></feColorMatrix>
    </filter>
  </svg>

  <audio id="bgm" loop preload="auto">
    <source src="assets/opening-bgm.m4a" type="audio/mp4">
  </audio>
</div>

<script type="module">
  import { initJukebox } from './assets/jukebox.js';

  const stage = document.getElementById('stage');
  const sceneTitle = document.getElementById('scene-title');
  const sceneHome = document.getElementById('scene-home');

  // ピアノマーク・設定(歯車)ボタン：画面自体は未実装。押し込み+波紋はaqbtnと同じ仕組みにする
  [document.getElementById('btn-piano-mark'), document.getElementById('btn-settings')].forEach(function(btn){
    function press(e){ btn.classList.add('pressed'); if(e) e.stopPropagation(); }
    function release(e){ btn.classList.remove('pressed'); if(e) e.stopPropagation(); }
    btn.addEventListener('touchstart', press, {passive:true});
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var rect = btn.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      for(var i=0;i<2;i++){
        (function(i){
          setTimeout(function(){
            var d = document.createElement('div');
            d.className = 'ripplefx';
            var size = 60 + Math.random()*30;
            d.style.width = size + 'px';
            d.style.height = size + 'px';
            d.style.left = (x + (Math.random()*6-3)) + 'px';
            d.style.top = (y + (Math.random()*6-3)) + 'px';
            btn.appendChild(d);
            d.addEventListener('animationend', function(){ d.remove(); });
          }, i*100);
        })(i);
      }
      console.log((btn.id === 'btn-piano-mark' ? 'piano mark' : 'settings') + ' button tapped (screen not implemented yet)');
    });
  });
  const homeVideo = document.getElementById('homeVideo');
  const bgm = document.getElementById('bgm');
  let started = false;

  function goToHome(){
    if(started) return;
    started = true;
    bgm.currentTime = 0;
    bgm.play().catch(()=>{});

    sceneTitle.classList.add('hidden');
    sceneTitle.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'opacity') return;
      sceneTitle.removeEventListener('transitionend', onEnd);
      sceneHome.classList.remove('hidden');
    });
  }

  stage.addEventListener('click', goToHome);
  stage.addEventListener('touchend', goToHome);

  let wasPlayingBeforeHidden = false;
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      wasPlayingBeforeHidden = !bgm.paused;
      bgm.pause();
    } else if(wasPlayingBeforeHidden){
      bgm.play().catch(()=>{});
    }
  });

  document.querySelectorAll('.aqbtn').forEach(function(btn){
    function press(e){ btn.classList.add('pressed'); if(e) e.stopPropagation(); }
    function release(e){ btn.classList.remove('pressed'); if(e) e.stopPropagation(); }
    btn.addEventListener('touchstart', press, {passive:true});
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var rect = btn.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      for(var i=0;i<2;i++){
        (function(i){
          setTimeout(function(){
            var d = document.createElement('div');
            d.className = 'ripplefx';
            var size = 180 + Math.random()*100;
            d.style.width = size + 'px';
            d.style.height = size + 'px';
            d.style.left = (x + (Math.random()*16-8)) + 'px';
            d.style.top = (y + (Math.random()*16-8)) + 'px';
            btn.appendChild(d);
            d.addEventListener('animationend', function(){ d.remove(); });
          }, i*100);
        })(i);
      }
    });
  });

  function spawnBackgroundRipple(clientX, clientY){
    var rect = stage.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    [0, 180].forEach(function(delay){
      setTimeout(function(){
        var d = document.createElement('div');
        d.className = 'bgripple';
        var size = 150 + Math.random()*60;
        d.style.width = size + 'px';
        d.style.height = size + 'px';
        d.style.left = x + 'px';
        d.style.top = y + 'px';
        stage.appendChild(d);
        d.addEventListener('animationend', function(){ d.remove(); });
      }, delay);
    });
  }
  [sceneTitle, sceneHome].forEach(function(scene){
    scene.addEventListener('click', function(e){
      if (e.target.closest && e.target.closest('#jukebox-overlay')) return;
      if (e.target.closest && e.target.closest('#btn-settings')) return;
      if (e.target.closest && e.target.closest('#btn-piano-mark')) return;
      spawnBackgroundRipple(e.clientX, e.clientY);
    });
    scene.addEventListener('touchend', function(e){
      if (e.target.closest && e.target.closest('#jukebox-overlay')) return;
      if (e.target.closest && e.target.closest('#btn-settings')) return;
      if (e.target.closest && e.target.closest('#btn-piano-mark')) return;
      var t = e.changedTouches && e.changedTouches[0];
      if(t) spawnBackgroundRipple(t.clientX, t.clientY);
    });
  });

  // ---- なぞり（ドラッグ）中の波紋 ----
  function spawnDragRipple(clientX, clientY){
    var rect = stage.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    var d = document.createElement('div');
    d.className = 'dragripple';
    var size = 70 + Math.random()*30;
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    stage.appendChild(d);
    d.addEventListener('animationend', function(){ d.remove(); });
  }

  (function(){
    var dragging = false;
    var lastX = 0, lastY = 0;
    var MIN_DIST = 18; // これ以上動いたら次の波紋を出す

    function onPointerDown(e){
      if (e.target.closest && e.target.closest('.aqbtn')) return; // ボタン上は対象外
      if (e.target.closest && e.target.closest('#jukebox-overlay')) return; // Jukebox内は対象外
      if (e.target.closest && e.target.closest('#btn-settings')) return; // 設定ボタン上は対象外
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
    }
    function onPointerMove(e){
      if (!dragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.sqrt(dx*dx + dy*dy) >= MIN_DIST) {
        spawnDragRipple(e.clientX, e.clientY);
        lastX = e.clientX; lastY = e.clientY;
      }
    }
    function onPointerUp(){ dragging = false; }

    stage.addEventListener('pointerdown', onPointerDown);
    stage.addEventListener('pointermove', onPointerMove);
    stage.addEventListener('pointerup', onPointerUp);
    stage.addEventListener('pointercancel', onPointerUp);
  })();


  initJukebox();
</script>
</body>
</html>
