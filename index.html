<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PianoWorks Crescendo — 画面遷移プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Zen+Old+Mincho&family=Yomogi&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  .stage{
    position:relative;
    width:100vw;height:100vh;height:100svh;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    background:#000;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .scene{
    position:absolute; inset:0;
    opacity:1;
    transition:opacity 0.9s ease;
    will-change:opacity;
    transform:translateZ(0);
    backface-visibility:hidden;
  }
  .scene.hidden{
    opacity:0;
    pointer-events:none;
  }
  .art{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
  }
  .scrim{
    position:absolute;top:0;left:0;right:0;height:30%;
    background:linear-gradient(to bottom, rgba(20,17,12,0.28), rgba(20,17,12,0));
    pointer-events:none;
  }

  /* ---- opening scene text ---- */
  @media (prefers-reduced-motion: no-preference){
    #scene-title .eyebrow{animation:fadein 0.3s ease-out forwards;}
    #scene-title .title{animation:reveal 5s cubic-bezier(0.16,1,0.3,1) 0.6s both;}
    .tap{animation:pulse 2.4s ease-in-out infinite;}
  }
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  @keyframes fadein{from{opacity:0;}to{opacity:.9;}}
  @keyframes reveal{
    0%{clip-path:inset(0 100% 0 0); filter:blur(12px); letter-spacing:10px; text-shadow:0 0 0 rgba(251,245,230,0);}
    70%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 0 rgba(251,245,230,0);}
    100%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 18px rgba(251,245,230,0.45);}
  }
  .titlewrap{position:absolute;top:calc(9% + 50px);left:0;right:0;text-align:center;pointer-events:none;}
  .eyebrow{font-family:'Yomogi', cursive;font-size:13px;letter-spacing:6px;color:#efe8d8;opacity:0;}
  .title{font-family:'Cormorant Garamond', serif;font-style:italic;font-size:44px;color:#fbf5e6;margin-top:6px;letter-spacing:1px;opacity:1;clip-path:inset(0 100% 0 0);}
  .tap{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-family:'Zen Old Mincho', serif;font-size:13px;letter-spacing:4px;color:#efe8d8;}

  /* ---- home scene ---- */
  .home-wordmark{position:absolute;top:8%;left:0;right:0;text-align:center;font-family:'Cormorant Garamond', serif;font-style:italic;font-size:20px;color:#efe4cf;opacity:.85;}
  .home-menu{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:row;justify-content:center;gap:0;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;}

  @keyframes bgripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.8; border-width:5px;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0; border-width:0.5px;}
  }
  .bgripple{
    position:absolute; border-radius:50%;
    border:5px solid rgba(221,208,197,0.6);
    box-shadow:0 0 10px rgba(221,208,197,0.3);
    background:transparent;
    filter:blur(3.5px);
    pointer-events:none;
    animation:bgripple 1.8s ease-out forwards;
  }
  @keyframes dragripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.5; border-width:2.5px;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0; border-width:0.5px;}
  }
  .dragripple{
    position:absolute; border-radius:50%;
    border:2.5px solid rgba(221,208,197,0.5);
    box-shadow:0 0 6px rgba(221,208,197,0.25);
    background:transparent;
    filter:blur(2px);
    pointer-events:none;
    animation:dragripple 0.9s ease-out forwards;
  }
  @keyframes ripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.55;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0;}
  }
  .ripplefx{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(230,224,208,0.5) 0%, rgba(200,194,178,0.25) 45%, rgba(200,194,178,0) 72%);
    filter:url(#ripple);
    pointer-events:none;
    animation:ripple 1.2s ease-out forwards;
  }
  .aqbtn{
    position:relative; flex:1; min-width:0; height:64px; cursor:pointer; overflow:hidden; border-radius:0;
    border:2px solid #a9a49690;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.25), inset 0 -8px 16px rgba(0,0,0,0.2), 0 3px 0 rgba(0,0,0,0.35);
    background:rgba(20,18,15,0.32);
    backdrop-filter:blur(7px) saturate(1.1);
    -webkit-backdrop-filter:blur(7px) saturate(1.1);
    transition:transform 0.09s ease-out, box-shadow 0.09s ease-out, backdrop-filter 0.12s ease-out, -webkit-backdrop-filter 0.12s ease-out;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;
  }
  .aqbtn.pressed{
    transform:translateY(2px) scale(0.985);
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.55), inset 0 -4px 10px rgba(0,0,0,0.3), 0 1px 0 rgba(0,0,0,0.5);
    backdrop-filter:blur(2px) saturate(1.25);
    -webkit-backdrop-filter:blur(2px) saturate(1.25);
  }
  .aqbtn .caustic-layer{position:absolute; inset:0; opacity:.3; mix-blend-mode:screen; filter:url(#caustic);}
  .aqbtn + .aqbtn{border-left:none;}
  .aqbtn:first-child{border-top-left-radius:22px;border-bottom-left-radius:22px;}
  .aqbtn:last-child{border-top-right-radius:22px;border-bottom-right-radius:22px;}
  .aqbtn .label{font-family:'Yomogi', cursive; font-size:13px; letter-spacing:2px; color:#f3ede0; text-shadow:0 0 10px rgba(230,224,208,0.4); white-space:nowrap;}

  #btn-piano-mark, #btn-settings{
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.25), inset 0 -6px 12px rgba(0,0,0,0.2), 0 2px 0 rgba(0,0,0,0.3);
    overflow:hidden;
  }
  #btn-piano-mark.pressed, #btn-settings.pressed{
    transform:translateY(2px) scale(0.92) !important;
    backdrop-filter:blur(0.5px) !important;
    -webkit-backdrop-filter:blur(0.5px) !important;
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.5), inset 0 -3px 8px rgba(0,0,0,0.3), 0 1px 0 rgba(0,0,0,0.4);
  }

  /* ---- Studio(GAME ON)：水スキン。既存クラスと衝突しないよう #scene-studio-play でスコープする ---- */
  #scene-studio{
    background:
      radial-gradient(ellipse at 50% 25%, rgba(45,70,140,0.07), transparent 65%),
      linear-gradient(180deg, #14110d 0%, #1c1712 100%);
  }
  #scene-studio-play .studio-playfield{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    perspective:500px;
  }
  #scene-studio-play .studio-lane{
    flex:1;
    position:relative;
    border-right:1px solid rgba(255,255,255,0.05);
    display:flex;
    flex-direction:column;
  }
  #scene-studio-play .studio-fall-area{
    flex:1;
    position:relative;
  }
  #scene-studio-play .studio-note{
    position:absolute;
    border-radius:10px;
    background:transparent;
    border:2px solid rgba(150,150,155,0.9);
    box-sizing:border-box;
    filter:url(#note-wobble);
    animation:studioNoteBreathe 3.4s ease-in-out infinite;
    cursor:pointer;
  }
  #scene-studio-play .studio-note .studio-mini-bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(40,120,235,0.85);
    border:1px solid rgba(30,110,230,0.6);
    transition:transform 1.4s ease-in-out;
  }
  #scene-studio-play .studio-note .studio-mini-bubble-line{
    position:absolute;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(150,150,155,0.8);
    transition:transform 1.4s ease-in-out;
  }
  @keyframes studioNoteBreathe{
    0%, 100%{opacity:0.7;}
    50%{opacity:1;}
  }
  @keyframes studioNotePop{
    0%{transform:scale(1); opacity:1;}
    35%{transform:scale(1.18); opacity:0.9;}
    100%{transform:scale(0.2); opacity:0;}
  }
  #scene-studio-play .studio-note.popping{
    animation:studioNotePop 0.32s cubic-bezier(0.34, 1.2, 0.64, 1) forwards !important;
  }
  #scene-studio-play .studio-droplet{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(200,215,235,0.95), rgba(40,65,150,0.55) 70%);
    box-shadow:0 0 4px rgba(70,100,190,0.5);
    pointer-events:none;
  }
  @keyframes studioDropletBurst{
    0%{transform:translate(0,0) scale(1); opacity:0.95;}
    100%{transform:translate(var(--dx), var(--dy)) scale(0.3); opacity:0;}
  }
  #scene-studio-play .studio-splash-ring{
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(180,200,230,0.6);
    background:transparent;
    pointer-events:none;
  }
  @keyframes studioSplashRing{
    0%{transform:translate(-50%,-50%) scale(0.2); opacity:0.8; border-width:3px;}
    100%{transform:translate(-50%,-50%) scale(2.4); opacity:0; border-width:0.5px;}
  }
  #scene-studio-play .studio-rising-bubble{
    position:absolute;
    bottom:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(210,225,245,0.85), rgba(50,80,170,0.35) 70%);
    border:1px solid rgba(180,200,230,0.4);
    pointer-events:none;
  }
  @keyframes studioBubbleRise{
    0%{transform:translate(0, 0); opacity:0;}
    12%{opacity:0.85;}
    100%{transform:translate(var(--drift, 0px), -100%); opacity:0;}
  }
  #scene-studio-play .studio-key{
    height:208px;
    margin:0 0 10px 0;
    border-radius:0;
    touch-action:none;
    transform-origin:top center;
    filter:blur(0.7px);
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 6px),
      linear-gradient(180deg, #ece2cd 0%, #d8c9a8 55%, #c2af86 100%);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.6),
      inset 0 -6px 10px rgba(90,68,35,0.35),
      0 3px 0 rgba(0,0,0,0.4);
    position:relative;
    transform:rotateX(0deg) translateY(0);
    transition:transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease-out;
  }
  #scene-studio-play .studio-key.pressed{
    transform:rotateX(var(--press-tilt, -9deg)) translateY(var(--press-dip, 3px));
    transition:transform 0.045s ease-out, box-shadow 0.045s ease-out;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(90,68,35,0.45),
      0 1px 0 rgba(0,0,0,0.4);
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 6px),
      linear-gradient(180deg, #dcc9a0 0%, #c8b284 55%, #b39d76 100%);
  }
  #scene-studio-play .studio-key::after{
    content:'';
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  #scene-studio-play .studio-key.pressed::after{
    animation:studioKeyflash 0.18s ease-out;
  }
  @keyframes studioKeyflash{
    0%{opacity:.35;}
    100%{opacity:0;}
  }
  @keyframes studioCountdownPulse{
    0%{transform:scale(0.6); opacity:0;}
    30%{transform:scale(1.08); opacity:1;}
    60%{transform:scale(1); opacity:1;}
    100%{transform:scale(0.94); opacity:0;}
  }
  #studio-countdown-bubble.pulse{
    animation:studioCountdownPulse 0.9s ease-out;
  }
  #scene-studio-play .studio-black-keys-layer{
    position:absolute;
    left:0; right:14.2857%; bottom:89px;
    height:129px;
    pointer-events:none;
    z-index:10;
  }
  #scene-studio-play .studio-black-key{
    position:absolute;
    top:0;
    width:9.3%;
    height:100%;
    filter:blur(0.7px);
    background:linear-gradient(180deg, #2a2320 0%, #100d0b 100%);
    border-radius:0 0 3px 3px;
    box-shadow:0 4px 6px rgba(0,0,0,0.5), inset 0 -8px 10px rgba(255,255,255,0.04);
    transform:translateX(-50%);
  }
  #scene-studio-play .studio-score-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:18px;
    border-left:1px solid rgba(232,150,66,0.25);
    background:rgba(20,17,13,0.35);
  }
  #scene-studio-play .studio-score-label{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:11px;
    letter-spacing:2px;
    color:#c9bfa9;
    opacity:.8;
  }
  #scene-studio-play .studio-score-value{
    font-family:'Yomogi', cursive;
    font-size:20px;
    color:#f3ede0;
    margin-top:4px;
    text-shadow:0 0 8px rgba(232,150,66,0.35);
  }
  #scene-studio-play .studio-combo-label{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:10px;
    letter-spacing:1px;
    color:#a99f8c;
    margin-top:22px;
  }
  #scene-studio-play .studio-combo-value{
    font-family:'Yomogi', cursive;
    font-size:16px;
    color:#e8a24a;
    margin-top:2px;
  }
  #scene-studio-play .studio-score-key-spacer{
    height:208px;
    margin-bottom:10px;
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="scene" id="scene-title">
    <video class="art" autoplay muted loop playsinline>
      <source src="assets/home-bg.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
    <div class="titlewrap">
      <div class="eyebrow">P I A N O W O R K S</div>
      <div class="title">Crescendo</div>
    </div>
    <div class="tap">タップして始める</div>
  </div>

  <div class="scene hidden" id="scene-home">
    <video class="art" autoplay muted loop playsinline preload="auto" id="homeVideo">
      <source src="assets/opening-bg.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
    <div id="datetime-display" style="position:absolute; top:calc(12px + env(safe-area-inset-top)); left:14px; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:15px; color:#efe4cf; text-shadow:0 1px 4px rgba(0,0,0,0.6); z-index:15; pointer-events:none;"></div>
    <div id="btn-piano-mark" style="position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(211,211,211,0.1); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:2px solid rgba(232,150,66,0.35); z-index:15; cursor:pointer; transition:transform 0.15s ease-out;">
      <img src="assets/piano-icon.png" alt="" style="width:60%; height:60%; object-fit:contain; pointer-events:none;">
    </div>
    <div id="btn-settings" style="position:absolute; top:calc(70px + env(safe-area-inset-top)); right:12px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(211,211,211,0.1); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:2px solid rgba(232,150,66,0.35); z-index:15; cursor:pointer; transition:transform 0.15s ease-out;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbd210" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
    <input type="file" id="midi-upload" accept=".mid,.midi" style="display:none;">
    <div id="import-status" style="position:absolute; left:0; right:0; top:40%; text-align:center; font-family:'Yomogi', cursive; font-size:13px; letter-spacing:2px; color:#efe4cf; opacity:0; transition:opacity 0.4s ease; pointer-events:none;"></div>
    <div class="home-menu">
      <div class="aqbtn" id="btn-import">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">IMPORT</div>
        </div>
      </div>
      <div class="aqbtn" id="btn-jukebox">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">JUKEBOX</div>
        </div>
      </div>
      <div class="aqbtn" id="btn-studio">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">STUDIO</div>
        </div>
      </div>
    </div>

    <div id="skin-overlay" style="position:absolute; inset:0; background:rgba(10,9,7,0.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:none; flex-direction:column; z-index:20;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px;">
        <div style="font-family:'Yomogi', cursive; font-size:20px; color:#efe4cf;">スキン</div>
        <div id="skin-close" style="color:#efe4cf; font-size:22px; padding:4px 10px; cursor:pointer;">×</div>
      </div>
      <div id="skin-list" style="flex:1; overflow-y:auto; padding:0 16px 16px 16px; display:flex; flex-direction:column; gap:0;"></div>
    </div>

    <div id="settings-overlay" style="position:absolute; inset:0; background:rgba(10,9,7,0.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:none; flex-direction:column; z-index:20;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px;">
        <div style="font-family:'Yomogi', cursive; font-size:20px; color:#efe4cf;">設定</div>
        <div id="settings-close" style="color:#efe4cf; font-size:22px; padding:4px 10px; cursor:pointer;">×</div>
      </div>
      <div style="flex:1; padding:0 16px 16px 16px; display:flex; flex-direction:column; gap:0;">
        <div id="settings-back-to-title" style="display:flex; align-items:center; padding:14px 2px; border-bottom:1px solid rgba(232,150,66,0.4); font-family:'Yomogi', cursive; font-size:14px; color:#f3ede0; letter-spacing:0.5px; cursor:pointer;">タイトルに戻る</div>
        <div id="settings-quit-app" style="display:flex; align-items:center; padding:14px 2px; border-bottom:1px solid rgba(232,150,66,0.4); font-family:'Yomogi', cursive; font-size:14px; color:#f3ede0; letter-spacing:0.5px; cursor:pointer;">アプリを終了</div>
      </div>
    </div>

    <div id="jukebox-overlay" style="position:absolute; inset:0; background:rgba(10,9,7,0.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:none; flex-direction:column; z-index:20;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px;">
        <div style="font-family:'Yomogi', cursive; font-size:20px; color:#efe4cf;">Jukebox</div>
        <div id="jukebox-close" style="color:#efe4cf; font-size:22px; padding:4px 10px; cursor:pointer;">×</div>
      </div>
      <div id="jukebox-list" style="flex:1; overflow-y:auto; padding:0 16px 16px 16px; display:flex; flex-direction:column; gap:0;"></div>
    </div>

    <div id="studio-list-overlay" style="position:absolute; inset:0; background:rgba(10,9,7,0.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:none; flex-direction:column; z-index:20;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px;">
        <div style="font-family:'Yomogi', cursive; font-size:20px; color:#efe4cf;">Studio</div>
        <div id="studio-list-close" style="color:#efe4cf; font-size:22px; padding:4px 10px; cursor:pointer;">×</div>
      </div>
      <div id="studio-song-list" style="flex:1; overflow-y:auto; padding:0 16px 16px 16px; display:flex; flex-direction:column; gap:0;"></div>
    </div>
  </div>

  <div class="scene hidden" id="scene-studio-play">
    <div id="studio-close" style="position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(211,211,211,0.1); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:2px solid rgba(232,150,66,0.35); z-index:15; cursor:pointer; color:#efe4cf; font-size:20px;">×</div>
    <div class="studio-playfield" id="studio-playfield"></div>
    <div id="studio-countdown" style="position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:14; pointer-events:none;">
      <div id="studio-countdown-bubble" style="width:140px; height:140px; border-radius:50%; border:3px solid rgba(150,150,155,0.9); filter:url(#note-wobble); display:flex; align-items:center; justify-content:center; background:rgba(20,17,13,0.35);">
        <div id="studio-countdown-number" style="font-family:'Yomogi', cursive; font-size:64px; color:#efe4cf;"></div>
      </div>
    </div>
  </div>

  <!-- すりガラスデザインの共通アラート/確認モーダル。window.confirm・alertの代わりに使う。
       どのscene(hidden切り替え)にも属させず、stage直下に置くことで、常に表示できるようにする -->
  <div id="custom-alert-overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:100; padding:24px;">
    <div style="background:rgba(20,17,13,0.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(232,150,66,0.4); border-radius:12px; padding:20px 22px; max-width:320px; box-shadow:0 10px 34px rgba(0,0,0,0.5);">
      <div id="custom-alert-message" style="font-family:'Yomogi', cursive; font-size:14px; color:#f3ede0; line-height:1.7; white-space:pre-line; margin-bottom:20px;"></div>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <div id="custom-alert-cancel" style="font-family:'Yomogi', cursive; font-size:13px; color:#a99f8c; padding:6px 14px; cursor:pointer;">キャンセル</div>
        <div id="custom-alert-ok" style="font-family:'Yomogi', cursive; font-size:13px; color:#efe4cf; padding:6px 16px; border:1px solid rgba(232,150,66,0.7); border-radius:6px; cursor:pointer;">OK</div>
      </div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <filter id="ripple" x="-80%" y="-80%" width="260%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.03" numOctaves="3" seed="9" result="noise"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="note-wobble" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.09" numOctaves="2" seed="11" result="noise"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="caustic" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" seed="3" result="noise">
        <animate attributeName="baseFrequency" values="0.02 0.06;0.03 0.05;0.02 0.06" dur="6s" repeatCount="indefinite"></animate>
      </feTurbulence>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.85, 0 0 0 0 0.8, 0 0 0 0 0.7, 0 0 0 0.5 0"></feColorMatrix>
    </filter>
  </svg>

  <audio id="bgm" loop preload="auto">
    <source src="assets/opening-bgm.mp3" type="audio/mpeg">
  </audio>
</div>

<script type="module">
  import { initJukebox, fadeBgm } from './assets/jukebox.js';
  import { initSkinList, openSkinList } from './assets/skin.js';
  import { initStudio } from './assets/studio.js';

  initSkinList();
  initStudio();

  const stage = document.getElementById('stage');
  const sceneTitle = document.getElementById('scene-title');
  const sceneHome = document.getElementById('scene-home');

  // ピアノマーク・設定(歯車)ボタン：画面自体は未実装。押し込み+波紋はaqbtnと同じ仕組みにする
  [document.getElementById('btn-piano-mark'), document.getElementById('btn-settings')].forEach(function(btn){
    function press(e){ btn.classList.add('pressed'); if(e) e.stopPropagation(); }
    function release(e){ btn.classList.remove('pressed'); if(e) e.stopPropagation(); }
    btn.addEventListener('touchstart', press, {passive:true});
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var rect = btn.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      for(var i=0;i<2;i++){
        (function(i){
          setTimeout(function(){
            var d = document.createElement('div');
            d.className = 'ripplefx';
            var size = 60 + Math.random()*30;
            d.style.width = size + 'px';
            d.style.height = size + 'px';
            d.style.left = (x + (Math.random()*6-3)) + 'px';
            d.style.top = (y + (Math.random()*6-3)) + 'px';
            btn.appendChild(d);
            d.addEventListener('animationend', function(){ d.remove(); });
          }, i*100);
        })(i);
      }
      if (btn.id === 'btn-piano-mark') {
        openSkinList();
      } else {
        openSettings();
      }
    });
  });

  // ---- すりガラスデザインの共通アラート/確認モーダル ----
  function showCustomModal(message, isConfirm) {
    return new Promise(function (resolve) {
      var overlay = document.getElementById('custom-alert-overlay');
      var msgEl = document.getElementById('custom-alert-message');
      var okBtn = document.getElementById('custom-alert-ok');
      var cancelBtn = document.getElementById('custom-alert-cancel');
      msgEl.textContent = message;
      cancelBtn.style.display = isConfirm ? 'block' : 'none';
      overlay.style.display = 'flex';

      function cleanup(result) {
        overlay.style.display = 'none';
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onOk(e) { e.stopPropagation(); cleanup(true); }
      function onCancel(e) { e.stopPropagation(); cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }
  window.showCustomAlert = function (message) { return showCustomModal(message, false); };
  window.showCustomConfirm = function (message) { return showCustomModal(message, true); };

  function openSettings(){
    document.getElementById('settings-overlay').style.display = 'flex';
  }
  function closeSettings(){
    document.getElementById('settings-overlay').style.display = 'none';
  }
  document.getElementById('settings-close').addEventListener('click', function(e){
    e.stopPropagation();
    closeSettings();
  });
  document.getElementById('settings-back-to-title').addEventListener('click', async function(e){
    e.stopPropagation();
    var confirmed = await window.showCustomConfirm('本当にタイトルに戻りますか？');
    if (!confirmed) return;
    closeSettings();
    goToTitle();
  });
  document.getElementById('settings-quit-app').addEventListener('click', function(e){
    e.stopPropagation();
    window.close();
    // ブラウザの仕様上、スクリプトから開いていないタブ・ウィンドウは閉じられないことが多い。
    // その場合に備えて、少し待っても画面が残っていたら一言添える。
    setTimeout(function(){
      window.showCustomAlert('ブラウザの設定上、自動では閉じられませんでした。タブを直接閉じてください。');
    }, 400);
  });

  const homeVideo = document.getElementById('homeVideo');
  const bgm = document.getElementById('bgm');
  let started = false;

  // ---- 左上の日時表示 ----
  var WEEKDAY_KANJI = ['日', '月', '火', '水', '木', '金', '土'];
  function updateDateTime(){
    var el = document.getElementById('datetime-display');
    if (!el) return;
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1;
    var d = now.getDate();
    var w = WEEKDAY_KANJI[now.getDay()];
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    el.textContent = y + '年' + m + '月' + d + '日(' + w + ') ' + hh + ':' + mm;
  }
  updateDateTime();
  setInterval(updateDateTime, 1000 * 15); // 15秒ごとに確認し、分が変わっていれば表示を更新する

  function goToHome(){
    if(started) return;
    started = true;
    bgm.volume = 0.7;
    bgm.currentTime = 0;
    bgm.play().catch(()=>{});

    sceneTitle.classList.add('hidden');
    sceneTitle.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'opacity') return;
      sceneTitle.removeEventListener('transitionend', onEnd);
      sceneHome.classList.remove('hidden');
    });
  }

  // 設定画面の「タイトルに戻る」用。goToHomeの逆再生で、フェードアウト→フェードインさせる
  function goToTitle(){
    if(!started) return;
    fadeBgm(0, 500);
    sceneHome.classList.add('hidden');
    sceneHome.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'opacity') return;
      sceneHome.removeEventListener('transitionend', onEnd);
      sceneTitle.classList.remove('hidden');
      started = false; // タイトルから、もう一度goToHomeできるようにする
    });
  }

  stage.addEventListener('click', goToHome);
  stage.addEventListener('touchend', goToHome);

  let wasPlayingBeforeHidden = false;
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      wasPlayingBeforeHidden = !bgm.paused;
      bgm.pause();
    } else if(wasPlayingBeforeHidden){
      bgm.play().catch(()=>{});
    }
  });

  document.querySelectorAll('.aqbtn').forEach(function(btn){
    function press(e){ btn.classList.add('pressed'); if(e) e.stopPropagation(); }
    function release(e){ btn.classList.remove('pressed'); if(e) e.stopPropagation(); }
    btn.addEventListener('touchstart', press, {passive:true});
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var rect = btn.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      for(var i=0;i<2;i++){
        (function(i){
          setTimeout(function(){
            var d = document.createElement('div');
            d.className = 'ripplefx';
            var size = 180 + Math.random()*100;
            d.style.width = size + 'px';
            d.style.height = size + 'px';
            d.style.left = (x + (Math.random()*16-8)) + 'px';
            d.style.top = (y + (Math.random()*16-8)) + 'px';
            btn.appendChild(d);
            d.addEventListener('animationend', function(){ d.remove(); });
          }, i*100);
        })(i);
      }
    });
  });

  function spawnBackgroundRipple(clientX, clientY){
    var rect = stage.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    [0, 180].forEach(function(delay){
      setTimeout(function(){
        var d = document.createElement('div');
        d.className = 'bgripple';
        var size = 150 + Math.random()*60;
        d.style.width = size + 'px';
        d.style.height = size + 'px';
        d.style.left = x + 'px';
        d.style.top = y + 'px';
        stage.appendChild(d);
        d.addEventListener('animationend', function(){ d.remove(); });
      }, delay);
    });
  }
  [sceneTitle, sceneHome].forEach(function(scene){
    scene.addEventListener('click', function(e){
      if (e.target.closest && (e.target.closest('#jukebox-overlay') || e.target.closest('#skin-overlay') || e.target.closest('#settings-overlay') || e.target.closest('#studio-list-overlay'))) return;
      if (e.target.closest && e.target.closest('#btn-settings')) return;
      if (e.target.closest && e.target.closest('#btn-piano-mark')) return;
      spawnBackgroundRipple(e.clientX, e.clientY);
    });
    scene.addEventListener('touchend', function(e){
      if (e.target.closest && (e.target.closest('#jukebox-overlay') || e.target.closest('#skin-overlay') || e.target.closest('#settings-overlay') || e.target.closest('#studio-list-overlay'))) return;
      if (e.target.closest && e.target.closest('#btn-settings')) return;
      if (e.target.closest && e.target.closest('#btn-piano-mark')) return;
      var t = e.changedTouches && e.changedTouches[0];
      if(t) spawnBackgroundRipple(t.clientX, t.clientY);
    });
  });

  // ---- なぞり（ドラッグ）中の波紋 ----
  function spawnDragRipple(clientX, clientY){
    var rect = stage.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    var d = document.createElement('div');
    d.className = 'dragripple';
    var size = 70 + Math.random()*30;
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    stage.appendChild(d);
    d.addEventListener('animationend', function(){ d.remove(); });
  }

  (function(){
    var dragging = false;
    var lastX = 0, lastY = 0;
    var MIN_DIST = 18; // これ以上動いたら次の波紋を出す

    function onPointerDown(e){
      if (e.target.closest && e.target.closest('.aqbtn')) return; // ボタン上は対象外
      if (e.target.closest && (e.target.closest('#jukebox-overlay') || e.target.closest('#skin-overlay') || e.target.closest('#settings-overlay') || e.target.closest('#studio-list-overlay'))) return; // Jukebox内は対象外
      if (e.target.closest && e.target.closest('#btn-settings')) return; // 設定ボタン上は対象外
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
    }
    function onPointerMove(e){
      if (!dragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.sqrt(dx*dx + dy*dy) >= MIN_DIST) {
        spawnDragRipple(e.clientX, e.clientY);
        lastX = e.clientX; lastY = e.clientY;
      }
    }
    function onPointerUp(){ dragging = false; }

    stage.addEventListener('pointerdown', onPointerDown);
    stage.addEventListener('pointermove', onPointerMove);
    stage.addEventListener('pointerup', onPointerUp);
    stage.addEventListener('pointercancel', onPointerUp);
  })();


  initJukebox();
</script>
</body>
</html>
