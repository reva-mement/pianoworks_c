<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PianoWorks Crescendo — タイトル画面プレビュー（動画版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Zen+Old+Mincho&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  .stage{
    position:relative;
    width:100vw;height:100vh;height:100dvh;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    background:#000;
  }
  .art{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
  }
  @media (prefers-reduced-motion: no-preference){
    .tap{animation:pulse 2.4s ease-in-out infinite;}
    .eyebrow{animation:fadein 0.3s ease-out forwards;}
    .title{animation:reveal 5s cubic-bezier(0.16,1,0.3,1) 0.6s both;}
  }
  @media (prefers-reduced-motion: reduce){
    .eyebrow{opacity:.9;}
    .title{opacity:1; clip-path:inset(0 0 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 18px rgba(251,245,230,0.45);}
  }
  @keyframes pulse{
    0%,100%{opacity:.55;}
    50%{opacity:1;}
  }
  @keyframes fadein{
    from{opacity:0;}
    to{opacity:.9;}
  }
  @keyframes reveal{
    0%{clip-path:inset(0 100% 0 0); filter:blur(12px); letter-spacing:10px; text-shadow:0 0 0 rgba(251,245,230,0);}
    70%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 0 rgba(251,245,230,0);}
    100%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 18px rgba(251,245,230,0.45);}
  }
  .scrim{
    position:absolute;top:0;left:0;right:0;height:30%;
    background:linear-gradient(to bottom, rgba(20,17,12,0.28), rgba(20,17,12,0));
    pointer-events:none;
  }
  .titlewrap{
    position:absolute;top:9%;left:0;right:0;
    text-align:center;
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Zen Old Mincho', serif;
    font-size:13px;
    letter-spacing:6px;
    color:#efe8d8;
    opacity:0;
  }
  .title{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:44px;
    color:#fbf5e6;
    margin-top:6px;
    letter-spacing:1px;
    opacity:1;
    clip-path:inset(0 100% 0 0);
  }
  .tap{
    position:absolute;bottom:6%;left:0;right:0;
    text-align:center;
    font-family:'Zen Old Mincho', serif;
    font-size:13px;
    letter-spacing:4px;
    color:#efe8d8;
  }
</style>
</head>
<body>
<div class="stage">
  <video class="art" autoplay muted loop playsinline>
    <source src="assets/bg.mp4" type="video/mp4">
  </video>
  <div class="scrim"></div>
  <div class="titlewrap">
    <div class="eyebrow">P I A N O W O R K S</div>
    <div class="title">Crescendo</div>
  </div>
  <div class="tap">タップして始める</div>
<audio id="bgm" loop preload="auto"><source src="assets/bgm.m4a" type="audio/mp4"></audio>
</div>
<script>
  const bgm = document.getElementById("bgm");
  const stage = document.querySelector(".stage");
  const tapline = document.querySelector(".tap");
  let started = false;
  function beginPlayback(){
    if(started) return;
    started = true;
    bgm.currentTime = 0;
    bgm.play().catch(()=>{});
    tapline.style.display = "none";
  }
  stage.addEventListener("click", beginPlayback);
  stage.addEventListener("touchend", beginPlayback);
</script>

</body>
</html>
