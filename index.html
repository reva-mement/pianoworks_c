<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PianoWorks Crescendo — 画面遷移プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Zen+Old+Mincho&family=Yomogi&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  .stage{
    position:relative;
    width:100vw;height:100vh;height:100svh;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    background:#000;
  }
  .scene{
    position:absolute; inset:0;
    opacity:1;
    transition:opacity 0.9s ease;
    will-change:opacity;
    transform:translateZ(0);
    backface-visibility:hidden;
  }
  .scene.hidden{
    opacity:0;
    pointer-events:none;
  }
  .art{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
  }
  .scrim{
    position:absolute;top:0;left:0;right:0;height:30%;
    background:linear-gradient(to bottom, rgba(20,17,12,0.28), rgba(20,17,12,0));
    pointer-events:none;
  }

  /* ---- opening scene text ---- */
  @media (prefers-reduced-motion: no-preference){
    #scene-title .eyebrow{animation:fadein 0.3s ease-out forwards;}
    #scene-title .title{animation:reveal 5s cubic-bezier(0.16,1,0.3,1) 0.6s both;}
    .tap{animation:pulse 2.4s ease-in-out infinite;}
  }
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  @keyframes fadein{from{opacity:0;}to{opacity:.9;}}
  @keyframes reveal{
    0%{clip-path:inset(0 100% 0 0); filter:blur(12px); letter-spacing:10px; text-shadow:0 0 0 rgba(251,245,230,0);}
    70%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 0 rgba(251,245,230,0);}
    100%{clip-path:inset(0 0% 0 0); filter:blur(0); letter-spacing:1px; text-shadow:0 0 18px rgba(251,245,230,0.45);}
  }
  .titlewrap{position:absolute;top:9%;left:0;right:0;text-align:center;pointer-events:none;}
  .eyebrow{font-family:'Zen Old Mincho', serif;font-size:13px;letter-spacing:6px;color:#efe8d8;opacity:0;}
  .title{font-family:'Cormorant Garamond', serif;font-style:italic;font-size:44px;color:#fbf5e6;margin-top:6px;letter-spacing:1px;opacity:1;clip-path:inset(0 100% 0 0);}
  .tap{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-family:'Zen Old Mincho', serif;font-size:13px;letter-spacing:4px;color:#efe8d8;}

  /* ---- home scene ---- */
  .home-wordmark{position:absolute;top:8%;left:0;right:0;text-align:center;font-family:'Cormorant Garamond', serif;font-style:italic;font-size:20px;color:#efe4cf;opacity:.85;}
  .home-menu{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:row;justify-content:center;gap:0;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;}

  @keyframes bgripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.8; border-width:5px;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0; border-width:0.5px;}
  }
  .bgripple{
    position:absolute; border-radius:50%;
    border:5px solid rgba(221,208,197,0.6);
    box-shadow:0 0 10px rgba(221,208,197,0.3);
    background:transparent;
    filter:blur(3.5px);
    pointer-events:none;
    animation:bgripple 1.8s ease-out forwards;
  }
  @keyframes ripple{
    0%{transform:translate(-50%,-50%) scale(0.05); opacity:0.55;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0;}
  }
  .ripplefx{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(230,224,208,0.5) 0%, rgba(200,194,178,0.25) 45%, rgba(200,194,178,0) 72%);
    filter:url(#ripple);
    pointer-events:none;
    animation:ripple 1.2s ease-out forwards;
  }
  .aqbtn{
    position:relative; flex:1; min-width:0; height:64px; cursor:pointer; overflow:hidden; border-radius:0;
    border:2px solid #a9a49690;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.25), inset 0 -8px 16px rgba(0,0,0,0.2), 0 3px 0 rgba(0,0,0,0.35);
    background:rgba(20,18,15,0.32);
    backdrop-filter:blur(7px) saturate(1.1);
    -webkit-backdrop-filter:blur(7px) saturate(1.1);
    transition:transform 0.09s ease-out, box-shadow 0.09s ease-out, backdrop-filter 0.12s ease-out, -webkit-backdrop-filter 0.12s ease-out;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;
  }
  .aqbtn.pressed{
    transform:translateY(2px) scale(0.985);
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.55), inset 0 -4px 10px rgba(0,0,0,0.3), 0 1px 0 rgba(0,0,0,0.5);
    backdrop-filter:blur(2px) saturate(1.25);
    -webkit-backdrop-filter:blur(2px) saturate(1.25);
  }
  .aqbtn .caustic-layer{position:absolute; inset:0; opacity:.3; mix-blend-mode:screen; filter:url(#caustic);}
  .aqbtn + .aqbtn{border-left:none;}
  .aqbtn:first-child{border-top-left-radius:22px;border-bottom-left-radius:22px;}
  .aqbtn:last-child{border-top-right-radius:22px;border-bottom-right-radius:22px;}
  .aqbtn .label{font-family:'Yomogi', cursive; font-size:13px; letter-spacing:2px; color:#f3ede0; text-shadow:0 0 10px rgba(230,224,208,0.4); white-space:nowrap;}
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="scene" id="scene-title">
    <video class="art" autoplay muted loop playsinline>
      <source src="assets/opening-bg.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
    <div class="titlewrap">
      <div class="eyebrow">P I A N O W O R K S</div>
      <div class="title">Crescendo</div>
    </div>
    <div class="tap">タップして始める</div>
  </div>

  <div class="scene hidden" id="scene-home">
    <video class="art" autoplay muted loop playsinline preload="auto" id="homeVideo">
      <source src="assets/home-bg.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>
    <div class="home-wordmark">Crescendo</div>
    <input type="file" id="midi-upload" accept=".mid,.midi" style="display:none;">
    <div id="import-status" style="position:absolute; left:0; right:0; top:40%; text-align:center; font-family:'Zen Old Mincho', serif; font-size:13px; letter-spacing:2px; color:#efe4cf; opacity:0; transition:opacity 0.4s ease; pointer-events:none;"></div>
    <div class="home-menu">
      <div class="aqbtn" id="btn-import">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">IMPORT</div>
        </div>
      </div>
      <div class="aqbtn" id="btn-jukebox">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">JUKEBOX</div>
        </div>
      </div>
      <div class="aqbtn" id="btn-studio">
        <div class="caustic-layer"></div>
        <div style="position:relative; height:100%; display:flex; align-items:center; justify-content:center;">
          <div class="label">STUDIO</div>
        </div>
      </div>
    </div>

    <div id="jukebox-overlay" style="position:absolute; inset:0; background:rgba(10,9,7,0.92); display:none; flex-direction:column; z-index:20;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px;">
        <div style="font-family:'Cormorant Garamond', serif; font-style:italic; font-size:20px; color:#efe4cf;">Jukebox</div>
        <div id="jukebox-close" style="color:#efe4cf; font-size:22px; padding:4px 10px; cursor:pointer;">×</div>
      </div>
      <div id="jukebox-list" style="flex:1; overflow-y:auto; padding:0 16px 16px 16px; display:flex; flex-direction:column; gap:10px;"></div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <filter id="ripple" x="-80%" y="-80%" width="260%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.03" numOctaves="3" seed="9" result="noise"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="caustic" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" seed="3" result="noise">
        <animate attributeName="baseFrequency" values="0.02 0.06;0.03 0.05;0.02 0.06" dur="6s" repeatCount="indefinite"></animate>
      </feTurbulence>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.85, 0 0 0 0 0.8, 0 0 0 0 0.7, 0 0 0 0.5 0"></feColorMatrix>
    </filter>
  </svg>

  <audio id="bgm" loop preload="auto">
    <source src="assets/opening-bgm.m4a" type="audio/mp4">
  </audio>
</div>

<script>
  const stage = document.getElementById('stage');
  const sceneTitle = document.getElementById('scene-title');
  const sceneHome = document.getElementById('scene-home');
  const homeVideo = document.getElementById('homeVideo');
  const bgm = document.getElementById('bgm');
  let started = false;

  function goToHome(){
    if(started) return;
    started = true;
    bgm.currentTime = 0;
    bgm.play().catch(()=>{});

    sceneTitle.classList.add('hidden');
    sceneTitle.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'opacity') return;
      sceneTitle.removeEventListener('transitionend', onEnd);
      sceneHome.classList.remove('hidden');
    });
  }

  stage.addEventListener('click', goToHome);
  stage.addEventListener('touchend', goToHome);

  let wasPlayingBeforeHidden = false;
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      wasPlayingBeforeHidden = !bgm.paused;
      bgm.pause();
    } else if(wasPlayingBeforeHidden){
      bgm.play().catch(()=>{});
    }
  });

  document.querySelectorAll('.aqbtn').forEach(function(btn){
    function press(e){ btn.classList.add('pressed'); if(e) e.stopPropagation(); }
    function release(e){ btn.classList.remove('pressed'); if(e) e.stopPropagation(); }
    btn.addEventListener('touchstart', press, {passive:true});
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var rect = btn.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      for(var i=0;i<2;i++){
        (function(i){
          setTimeout(function(){
            var d = document.createElement('div');
            d.className = 'ripplefx';
            var size = 180 + Math.random()*100;
            d.style.width = size + 'px';
            d.style.height = size + 'px';
            d.style.left = (x + (Math.random()*16-8)) + 'px';
            d.style.top = (y + (Math.random()*16-8)) + 'px';
            btn.appendChild(d);
            d.addEventListener('animationend', function(){ d.remove(); });
          }, i*100);
        })(i);
      }
    });
  });

  function spawnBackgroundRipple(clientX, clientY){
    var rect = stage.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    [0, 180].forEach(function(delay){
      setTimeout(function(){
        var d = document.createElement('div');
        d.className = 'bgripple';
        var size = 150 + Math.random()*60;
        d.style.width = size + 'px';
        d.style.height = size + 'px';
        d.style.left = x + 'px';
        d.style.top = y + 'px';
        stage.appendChild(d);
        d.addEventListener('animationend', function(){ d.remove(); });
      }, delay);
    });
  }
  [sceneTitle, sceneHome].forEach(function(scene){
    scene.addEventListener('click', function(e){ spawnBackgroundRipple(e.clientX, e.clientY); });
    scene.addEventListener('touchend', function(e){
      var t = e.changedTouches && e.changedTouches[0];
      if(t) spawnBackgroundRipple(t.clientX, t.clientY);
    });
  });

  // ---- MIDI import ----
  var midiInput = document.getElementById('midi-upload');
  var importStatus = document.getElementById('import-status');
  var btnImport = document.getElementById('btn-import');

  function showImportStatus(text, autoHide){
    importStatus.textContent = text;
    importStatus.style.opacity = '1';
    if(autoHide){
      setTimeout(function(){ importStatus.style.opacity = '0'; }, 2200);
    }
  }

  btnImport.addEventListener('click', function(e){
    // 波紋処理はaqbtn共通のclickリスナーで既に発火するので、ここではファイル選択だけ開く
    midiInput.click();
  });

  midiInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;

    showImportStatus('読み込み中…', false);

    var reader = new FileReader();
    reader.onload = async function(ev){
      var arrayBuffer = ev.target.result;
      try {
        var Lib = await import('./assets/midiplayer.js');
        var PlayerConstructor = Lib.default.Player;
        var player = new PlayerConstructor(function(){}); // 再生イベントは今回不要なのでno-op
        player.loadArrayBuffer(arrayBuffer);

        var songData = extractNotesFromMidi(player);
        var entry = {
          name: file.name.replace(/\.[^/.]+$/, ''),
          songData: songData,
          durationMs: window.currentSongDurationMs || 0,
          scoreHistory: [] // Studio実装後、プレイのたびにスコア(0-100)を追加していく想定
        };
        window.jukeboxLibrary = window.jukeboxLibrary || [];
        window.jukeboxLibrary.push(entry);
        renderJukeboxList();

        console.log('MIDI parsed:', file.name, songData.length, 'notes');

        if(songData.length > 0){
          var durationSec = Math.round(entry.durationMs / 1000);
          showImportStatus('「' + entry.name + '」　' + songData.length + '音 / 約' + durationSec + '秒', true);
        } else {
          showImportStatus('音符が見つかりませんでした', true);
        }
      } catch(err){
        console.error('MIDI parse error:', err);
        showImportStatus('解析に失敗しました', true);
      }
    };
    reader.onerror = function(){
      showImportStatus('読み込みに失敗しました', true);
    };
    reader.readAsArrayBuffer(file);

    // 同じファイルを連続で選び直せるようにリセット
    midiInput.value = '';
  });

  // ---- extractNotesFromMidi: 本体(main.js)から移植 ----
  function extractNotesFromMidi(player){
    var division = player.division;
    var allEvents = [];
    (player.tracks || []).forEach(function(track){
      if (track && Array.isArray(track.events)) {
        allEvents.push.apply(allEvents, track.events);
      }
    });

    var tempoEvents = allEvents
      .filter(function(ev){ return ev.name === 'Set Tempo' && typeof ev.tick === 'number' && ev.data; })
      .map(function(ev){ return { tick: ev.tick, bpm: ev.data }; })
      .sort(function(a,b){ return a.tick - b.tick; });

    if (tempoEvents.length === 0 || tempoEvents[0].tick > 0) {
      tempoEvents.unshift({ tick: 0, bpm: player.tempo || 120 });
    }

    var segments = [];
    tempoEvents.forEach(function(te){
      var msPerTick = (60 / te.bpm / division) * 1000;
      var prev = segments[segments.length - 1];
      var startMs = prev ? prev.startMs + (te.tick - prev.startTick) * prev.msPerTick : 0;
      segments.push({ startTick: te.tick, startMs: startMs, msPerTick: msPerTick });
    });

    function tickToMs(targetTick){
      for (var i = segments.length - 1; i >= 0; i--) {
        if (segments[i].startTick <= targetTick) {
          var seg = segments[i];
          return seg.startMs + (targetTick - seg.startTick) * seg.msPerTick;
        }
      }
      return 0;
    }

    var songData = [];
    (player.tracks || []).forEach(function(track){
      if (!track || !Array.isArray(track.events)) return;
      var activeNotes = {};

      track.events.forEach(function(ev){
        if (ev.name === "Note on" && ev.velocity > 0) {
          activeNotes[ev.noteNumber] = { startTick: ev.tick, velocity: ev.velocity };
        }
        if (ev.name === "Note off" || (ev.name === "Note on" && ev.velocity === 0)) {
          var info = activeNotes[ev.noteNumber];
          if (info) {
            var startMs = tickToMs(info.startTick);
            var endMs = tickToMs(ev.tick);
            songData.push({
              pitch: ev.noteNumber,
              velocity: info.velocity,
              time: startMs,
              duration: Math.max(0, endMs - startMs)
            });
            delete activeNotes[ev.noteNumber];
          }
        }
      });
    });

    songData.sort(function(a,b){ return a.time - b.time; });

    if (songData.length > 0) {
      var lastNote = songData[songData.length - 1];
      window.currentSongDurationMs = lastNote.time + (lastNote.duration || 0);
    } else {
      window.currentSongDurationMs = 0;
    }

    return songData;
  }

  // ---- ピアノ再生エンジン（Salamander 3レイヤー） ----
  var SAMPLE_NOTES = [
    {n:'A0',m:21},{n:'C1',m:24},{n:'Ds1',m:27},{n:'Fs1',m:30},{n:'A1',m:33},
    {n:'C2',m:36},{n:'Ds2',m:39},{n:'Fs2',m:42},{n:'A2',m:45},
    {n:'C3',m:48},{n:'Ds3',m:51},{n:'Fs3',m:54},{n:'A3',m:57},
    {n:'C4',m:60},{n:'Ds4',m:63},{n:'Fs4',m:66},{n:'A4',m:69},
    {n:'C5',m:72},{n:'Ds5',m:75},{n:'Fs5',m:78},{n:'A5',m:81},
    {n:'C6',m:84},{n:'Ds6',m:87},{n:'Fs6',m:90},{n:'A6',m:93},
    {n:'C7',m:96},{n:'Ds7',m:99},{n:'Fs7',m:102},{n:'A7',m:105},
    {n:'C8',m:108}
  ];

  var pianoCtx = null;
  var pianoBuffers = { soft:{}, mid:{}, loud:{} };
  var pianoLoaded = false;
  var pianoLoadingPromise = null;

  function loadPianoSamples(){
    if (pianoLoadingPromise) return pianoLoadingPromise;
    pianoCtx = pianoCtx || new (window.AudioContext || window.webkitAudioContext)();
    var layers = ['soft','mid','loud'];
    var tasks = [];
    layers.forEach(function(layer){
      SAMPLE_NOTES.forEach(function(sn){
        var url = 'assets/sounds/' + layer + '/' + sn.n + '.opus';
        tasks.push(
          fetch(url)
            .then(function(r){ return r.arrayBuffer(); })
            .then(function(buf){ return pianoCtx.decodeAudioData(buf); })
            .then(function(decoded){ pianoBuffers[layer][sn.n] = decoded; })
            .catch(function(err){ console.error('sample load failed:', url, err); })
        );
      });
    });
    pianoLoadingPromise = Promise.all(tasks).then(function(){
      pianoLoaded = true;
      console.log('Piano samples loaded');
    });
    return pianoLoadingPromise;
  }

  function nearestSample(midiPitch){
    var best = SAMPLE_NOTES[0];
    var bestDist = Math.abs(midiPitch - best.m);
    for (var i = 1; i < SAMPLE_NOTES.length; i++) {
      var d = Math.abs(midiPitch - SAMPLE_NOTES[i].m);
      if (d < bestDist) { best = SAMPLE_NOTES[i]; bestDist = d; }
    }
    return best;
  }

  function velocityToLayer(v){
    var v127 = v <= 1 ? v * 127 : v;
    if (v127 < 45) return 'soft';
    if (v127 < 95) return 'mid';
    return 'loud';
  }

  function scheduleNote(note, startAt){
    var layer = velocityToLayer(note.velocity);
    var sample = nearestSample(note.pitch);
    var buffer = pianoBuffers[layer][sample.n];
    if (!buffer) return;

    var semitoneDiff = note.pitch - sample.m;
    var playbackRate = Math.pow(2, semitoneDiff / 12);

    var src = pianoCtx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = playbackRate;

    var gainNode = pianoCtx.createGain();
    var v127 = note.velocity <= 1 ? note.velocity * 127 : note.velocity;
    gainNode.gain.value = Math.max(0.15, Math.min(1, v127 / 110));

    src.connect(gainNode).connect(pianoCtx.destination);
    src.start(startAt);
  }

  var currentPlayback = { timeouts: [], playing: false, index: -1 };

  function stopJukeboxPlayback(){
    currentPlayback.timeouts.forEach(function(t){ clearTimeout(t); });
    currentPlayback.timeouts = [];
    currentPlayback.playing = false;
    renderJukeboxList();
  }

  function playSong(index){
    stopJukeboxPlayback();
    var entry = window.jukeboxLibrary[index];
    if (!entry) return;

    currentPlayback.playing = true;
    currentPlayback.index = index;
    renderJukeboxList();

    loadPianoSamples().then(function(){
      if (!currentPlayback.playing || currentPlayback.index !== index) return; // 読み込み待ちの間に停止/切替された場合は何もしない
      var startAt = pianoCtx.currentTime + 0.15;
      entry.songData.forEach(function(note){
        scheduleNote(note, startAt + note.time / 1000);
      });
      var endTimeout = setTimeout(function(){
        currentPlayback.playing = false;
        renderJukeboxList();
      }, entry.durationMs + 400);
      currentPlayback.timeouts.push(endTimeout);
    });
  }

  function drawSparkline(canvas, history){
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var w = rect.width, h = rect.height;
    ctx.clearRect(0, 0, w, h);

    if (!history || history.length === 0) {
      ctx.strokeStyle = 'rgba(169,164,150,0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2,3]);
      ctx.beginPath();
      ctx.moveTo(4, h/2);
      ctx.lineTo(w-4, h/2);
      ctx.stroke();
      ctx.setLineDash([]);
      return;
    }

    var maxScore = 100;
    ctx.strokeStyle = 'rgba(232,150,66,0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    history.forEach(function(score, i){
      var x = 4 + (i / Math.max(1, history.length - 1)) * (w - 8);
      var y = h - 4 - (score / maxScore) * (h - 8);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  function renderJukeboxList(){
    var list = document.getElementById('jukebox-list');
    if (!list) return;
    var lib = window.jukeboxLibrary || [];
    list.innerHTML = '';

    if (lib.length === 0) {
      var empty = document.createElement('div');
      empty.style.cssText = "color:#cbbfa8; font-family:'Zen Old Mincho', serif; font-size:13px; padding:20px 4px; opacity:.8;";
      empty.textContent = 'まだ曲がありません。IMPORTからMIDIを読み込んでください。';
      list.appendChild(empty);
      return;
    }

    lib.forEach(function(entry, i){
      var isPlaying = currentPlayback.playing && currentPlayback.index === i;

      var row = document.createElement('div');
      row.style.cssText = "display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px solid " + (isPlaying ? "rgba(232,150,66,0.85)" : "rgba(169,164,150,0.35)") + "; border-radius:3px; background:rgba(20,17,13,0.5);";

      // No.
      var noEl = document.createElement('div');
      noEl.style.cssText = "font-family:'Zen Old Mincho', serif; font-size:12px; color:#a99f8c; width:20px; flex-shrink:0;";
      noEl.textContent = (i + 1);

      // タイトル
      var title = document.createElement('div');
      title.style.cssText = "font-family:'Zen Old Mincho', serif; font-size:14px; color:#f3ede0; letter-spacing:0.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;";
      title.textContent = entry.name;

      // 再生ボタン
      var playBtn = document.createElement('div');
      playBtn.style.cssText = "flex-shrink:0; width:28px; height:28px; border-radius:50%; border:1px solid rgba(232,150,66,0.7); display:flex; align-items:center; justify-content:center; color:#efe4cf; font-size:12px; cursor:pointer;";
      playBtn.textContent = isPlaying ? '■' : '▶';
      playBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (isPlaying) { stopJukeboxPlayback(); }
        else { playSong(i); }
      });

      // グラフ（スパークライン）
      var graphCanvas = document.createElement('canvas');
      graphCanvas.style.cssText = "flex-shrink:0; width:56px; height:24px;";

      // 削除ボタン
      var delBtn = document.createElement('div');
      delBtn.style.cssText = "flex-shrink:0; width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:#a99f8c; font-size:16px; cursor:pointer;";
      delBtn.textContent = '×';
      delBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (isPlaying) stopJukeboxPlayback();
        window.jukeboxLibrary.splice(i, 1);
        renderJukeboxList();
      });

      row.appendChild(noEl);
      row.appendChild(title);
      row.appendChild(playBtn);
      row.appendChild(graphCanvas);
      row.appendChild(delBtn);
      list.appendChild(row);

      drawSparkline(graphCanvas, entry.scoreHistory);
    });
  }

  var jukeboxOverlay = document.getElementById('jukebox-overlay');
  var btnJukebox = document.getElementById('btn-jukebox');
  btnJukebox.addEventListener('click', function(e){
    jukeboxOverlay.style.display = 'flex';
    renderJukeboxList();
    loadPianoSamples(); // 開いたタイミングで先読みを始めておく
  });
  document.getElementById('jukebox-close').addEventListener('click', function(e){
    e.stopPropagation();
    stopJukeboxPlayback();
    jukeboxOverlay.style.display = 'none';
  });
</script>
</body>
</html>
